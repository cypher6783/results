spring.application.name=result-system
server.port=${PORT:8080}

# Database Configuration (PostgreSQL for Railway)
# This uses individual environment variables provided by Railway for better reliability.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Initialize data after schema creation
# defer-datasource-initialization=true ensures data.sql runs AFTER Hibernate's update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Railway / Proxy Headers
# Native support works with server.forward-headers-strategy=native
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Ensure headless mode for QR generation and PDF libraries
java.awt.headless=true
spring.main.allow-bean-definition-overriding=true
